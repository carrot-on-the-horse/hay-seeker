[package]
name = "hay-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP stdio adapter for the backend-neutral Hay Seeker search contract"

[features]
default = ["phase0"]
phase0 = ["hay-search/phase0"]

[[bin]]
name = "hay-mcp"
path = "src/main.rs"
required-features = ["phase0"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
cast-core.workspace = true
cast-index.workspace = true
clap.workspace = true
dotenvy.workspace = true
hay-duckdb.workspace = true
hay-elasticsearch.workspace = true
hay-runtime.workspace = true
hay-search.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

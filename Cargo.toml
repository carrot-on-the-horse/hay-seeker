[workspace]
members = [
    "crates/cast-cli",
    "crates/cast-core",
    "crates/cast-embeddings",
    "crates/cast-index",
    "crates/cast-tokenizers",
    "crates/cast-tree-sitter",
    "crates/hay-eval",
    "crates/hay-duckdb",
    "crates/hay-elasticsearch",
    "crates/hay-mcp",
    "crates/hay-runtime",
    "crates/hay-cli",
    "crates/hay-search",
]
exclude = ["benchmarks/gigatoken-rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/carrot-on-the-horse/hay-seeker"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
cast-core = { path = "crates/cast-core", version = "0.1.0" }
cast-embeddings = { path = "crates/cast-embeddings", version = "0.1.0" }
cast-index = { path = "crates/cast-index", version = "0.1.0" }
cast-tokenizers = { path = "crates/cast-tokenizers", version = "0.1.0" }
cast-tree-sitter = { path = "crates/cast-tree-sitter", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
criterion = "0.7.0"
dotenvy = "0.15"
dispatch2 = "=0.3.1"
duckdb = { version = "1.10505.0", features = ["bundled"] }
futures = "0.3"
half = "2.7"
hay-search = { path = "crates/hay-search", version = "0.1.0" }
hay-duckdb = { path = "crates/hay-duckdb", version = "0.1.0" }
hay-elasticsearch = { path = "crates/hay-elasticsearch", version = "0.1.0" }
hay-runtime = { path = "crates/hay-runtime", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
thiserror = "2.0"
tempfile = "3.20"
tiktoken-rs = "=0.12.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
ring = "=0.17.14"
sha2 = "0.10"
safetensors = "0.5"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
